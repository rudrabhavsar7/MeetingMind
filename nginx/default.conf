# ===========================================================================
# MeetingMind — Nginx reverse-proxy configuration
#
# Production: operator provides TLS cert/key and uncomments the HTTPS server.
# Development: HTTP-only on port 80.
# ===========================================================================

upstream frontend {
    server frontend:3000;
}

upstream api {
    server api:8000;
}

# --------------------------------------------------------------------------
# Rate-limiting zones
# --------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m    rate=5r/s;

# --------------------------------------------------------------------------
# HTTP server (development or redirect-to-HTTPS in production)
# --------------------------------------------------------------------------
server {
    listen 80;
    server_name _;

    # In production, uncomment to redirect all HTTP to HTTPS:
    # return 301 https://$host$request_uri;

    # --- Health check (always available) ---
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # --- API routes ---
    location /api/ {
        limit_req zone=api_general burst=20 nodelay;

        proxy_pass         http://api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID      $request_id;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Import uploads are bounded by presigned URLs, not Nginx
        client_max_body_size 1m;
    }

    # --- Auth routes (stricter rate limit) ---
    location /auth/ {
        limit_req zone=api_auth burst=5 nodelay;

        proxy_pass         http://api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID      $request_id;
    }

    # --- Health endpoint (root level) ---
    location = /health {
        proxy_pass         http://api;
        proxy_set_header   Host              $host;
    }

    # --- WebSocket: live audio stream ---
    location ~ ^/api/v1/workspaces/.+/meetings/.+/stream$ {
        proxy_pass         http://api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Long-lived WebSocket connections (8h meeting max + buffer)
        proxy_read_timeout 30000s;
        proxy_send_timeout 30000s;
    }

    # --- WebSocket: meeting status ---
    location ~ ^/ws/meetings/.+/status$ {
        proxy_pass         http://api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
    }

    # --- Docs (development only, blocked in production) ---
    location /docs {
        proxy_pass         http://api;
        proxy_set_header   Host              $host;
    }

    location /redoc {
        proxy_pass         http://api;
        proxy_set_header   Host              $host;
    }

    # --- Frontend (catch-all) ---
    location / {
        proxy_pass         http://frontend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# --------------------------------------------------------------------------
# HTTPS server (production — uncomment and provide cert/key)
# --------------------------------------------------------------------------
